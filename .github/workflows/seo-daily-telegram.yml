name: Daily SEO Telegram

on:
  schedule:
    # 09:00 Kyiv (UTC+3) ≈ 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  seo-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          ls -la package.json package-lock.json
          npm ci || npm install

      - name: Send SEO digest to Telegram
        run: npm run seo:daily
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: sc-domain:ofmmodels.com
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
